name: validate

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  global-qa-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: '8.3'
      - name: Get composer cache directory
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.3-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --dev
      - name: php MD
        run: ./vendor/bin/phpmd src text ./ruleset.xml
      - name: php CD
        run: ./vendor/bin/phpcs
      - name: PHPUnit Coverage
        run: ./vendor/bin/phpunit --coverage-clover coverage.xml
      - uses: codecov/codecov-action@v4

  psalm-over-php-versions:
    strategy:
      fail-fast: false
      matrix:
        php-versions: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]
        include:
          - php-versions: '8.1'
            env: COMPOSER_FLAGS="--prefer-lowest"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php-versions }}
      - name: Get composer cache directory
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-versions }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-versions }}
      - name: Install dependencies
        run: composer install $COMPOSER_FLAGS --no-interaction --prefer-dist --dev
      - name: Psalm
        run: ./vendor/bin/psalm
